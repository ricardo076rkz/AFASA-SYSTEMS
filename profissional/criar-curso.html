<!DOCTYPE html>

<!-- Essa página faz: Formulário para o Profissional criar um novo curso (POST /api/cursos). -->

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Curso - AFASA SYSTEMS</title>
    <link rel="stylesheet" href="../css/principal.css">
</head>

<body>
    <div class="header">
        <div class="header-content container">
            <a href="profissional-dashboard.html" class="back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                </svg>
                Voltar
            </a>
            <a href="profissional-dashboard.html" class="header-logo">
                <img class="logo" src="../imagens/logo.png" alt="Logo">
            </a>
        </div>
    </div>

    <div class="container">
        <div style="padding: 24px 20px 100px;">
            <h1 style="font-size: 28px; margin-bottom: 8px;">📚 Criar Curso</h1>
            <p style="color: var(--gray-light); margin-bottom: 32px;">Preencha os dados do novo curso</p>
            <form onsubmit="criarCurso(event)">
                <div class="form-group">
                    <label>Nome do curso (máx. 40 caracteres)</label>
                    <input type="text" id="curso-nome" placeholder="Ex.: Horta em Vasos" maxlength="40" required>
                </div>

                <div class="form-group">
                    <label>Descrição (máx. 300 caracteres)</label>
                    <textarea id="curso-descricao" placeholder="Sobre o que é o curso..." rows="4"
                        maxlength="300"></textarea>
                </div>

                <div class="form-group">
                    <label>Duração (em horas)</label>
                    <input type="number" id="curso-tempo" placeholder="Ex.: 10" min="0.5" max="100" step="0.5">
                </div>

                <div class="form-group">
                    <label>Categoria</label>
                    <select id="curso-categoria" required>
                        <option value="">Selecione...</option>
                    </select>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px;">
                    <a href="profissional-dashboard.html" class="btn"
                        style="background: var(--zinc-900); color: var(--white); text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center;">CANCELAR</a>
                    <button type="submit" id="btn-criar-curso" class="btn btn-primary">✅ CRIAR CURSO</button>
                </div>
            </form>
        </div>
        </form>
    </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="../js/roteiro.js"></script>
</body>

</html>
